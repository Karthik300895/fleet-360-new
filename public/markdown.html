    <script>
      let files = [];
      let activeFileId = null;
      let isDirty = false;
      let currentMode = 'preview';
      let openFolders = new Set();

      // Phase Gate Definitions
      function formatFileDateTime(isoString) {
        if (!isoString) return new Date().toLocaleString();
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return isoString;
        return d.toLocaleString(undefined, {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
        });
      }

      async function updateDrawerFrameworkVersion(version) {
        const label = document.getElementById('drawerVersionLabel');
        if (!label) return;
        if (version && typeof version === 'string') {
          const clean = version.trim().replace(/^[^0-9]*/, '');
          if (clean) {
            label.textContent = `v${clean}`;
            return;
          }
        }
        try {
          const candidates = ['/package.json', '/node_modules/acl-adlc/package.json'];
          for (const candidate of candidates) {
            try {
              const res = await fetch(candidate);
              if (res.ok) {
                const pkg = await res.json();
                if (pkg && pkg.name === 'acl-adlc' && pkg.version) {
                  label.textContent = `v${pkg.version}`;
                  return;
                }
                const depVer = pkg?.dependencies?.['acl-adlc'] || pkg?.devDependencies?.['acl-adlc'];
                if (depVer) {
                  const clean = String(depVer).replace(/^[^0-9]*/, '');
                  if (clean) {
                    label.textContent = `v${clean}`;
                    return;
                  }
                }
              }
            } catch (e) {}
          }
        } catch (err) {}
      }

      function isChildFile(filename, folderPath = '') {
        if (!filename) return true;
        const lower = filename.toLowerCase();
        const lowerFolder = (folderPath || '').toLowerCase();
        if (lower.startsWith('.')) return true;
        if (lower.includes('memlog')) return true;
        if (lower.startsWith('readiness-report')) return true;
        if (isTestDeliverable(filename, folderPath)) return false;
        if (lowerFolder.includes('/tests') || lowerFolder.endsWith('tests') || lowerFolder === 'tests') return true;

        const EXCLUDED_CHILDREN = new Set([
          'addendum.md',
          'sources.md',
          'review-triage.md',
          'patch-plan.md',
          'research.md',
          'test-summary.md',
          'memlog.md',
          '.memlog.md',
          'skill.md',
          'agents.md',
          'readme.md',
          'changelog.md',
          'claude.md',
          'security.md',
          'contributing.md',
          'sprint-status.yaml',
          'sprint-status.yml',
          'sprint-status.md',
        ]);

        return EXCLUDED_CHILDREN.has(lower);
      }

      let isSyncing = false;
      let isSaving = false;
      let lastSaveTime = 0;
      async function syncFromLiveDisk(quiet = false) {
        if (isSyncing || isSaving || Date.now() - lastSaveTime < 3500) return false;
        isSyncing = true;
        try {
          const cloudToken = (localStorage.getItem('acl_github_token') || '').trim();
          const cloudOwner = (localStorage.getItem('acl_github_owner') || '').trim();
          const cloudRepo = (localStorage.getItem('acl_github_repo') || '').trim();
          const cloudBranch = (localStorage.getItem('acl_github_branch') || '').trim();

          const headers = { 'Cache-Control': 'no-store' };
          if (cloudToken) {
            headers['Authorization'] = 'Bearer ' + cloudToken;
            headers['X-GitHub-Token'] = cloudToken;
          }

          let queryUrl = '/api/list-markdown-files?t=' + Date.now();
          if (cloudOwner) queryUrl += '&owner=' + encodeURIComponent(cloudOwner);
          if (cloudRepo) queryUrl += '&repo=' + encodeURIComponent(cloudRepo);
          if (cloudBranch) queryUrl += '&branch=' + encodeURIComponent(cloudBranch);

          let res = await fetch(queryUrl, { headers, cache: 'no-store' });
          if (!res.ok) {
            try {
              const fallbackUrl = 'http://localhost:3333' + queryUrl;
              const fbRes = await fetch(fallbackUrl, { headers, cache: 'no-store' });
              if (fbRes.ok) {
                res = fbRes;
                window.__ACL_LIVE_ENDPOINT__ = 'http://localhost:3333';
              }
            } catch (fbErr) {}
          }
          if (res.ok) {
            const data = await res.json();
            if (data && (data.frameworkVersion || data.version)) {
              updateDrawerFrameworkVersion(data.frameworkVersion || data.version);
            }
            if (data && data.activeTier) {
              window.__serverActiveTier = String(data.activeTier);
            }
            if (data && Array.isArray(data.files)) {
              let filteredFiles = data.files.filter((f) => !isChildFile(f.filename, f.folderPath));

              // Deduplicate files: prefer canonical numbered phase directories over root/duplicate paths
              // EXCEPTION: project-context.md MUST always prefer root over nested directories!
              const seenMap = new Map();
              for (const f of filteredFiles) {
                const key = f.filename.toLowerCase();
                if (!seenMap.has(key)) {
                  seenMap.set(key, f);
                } else {
                  const existing = seenMap.get(key);
                  if (key === 'project-context.md') {
                    if (f.folderPath === 'root' || !f.folderPath.includes('0-context')) {
                      seenMap.set(key, f);
                    }
                  } else if (existing.folderPath === 'root' || (!existing.folderPath.match(/[0-4]-/) && f.folderPath.match(/[0-4]-/))) {
                    seenMap.set(key, f);
                  }
                }
              }
              filteredFiles = Array.from(seenMap.values());

              if (filteredFiles.length === 0) {
                files = [];
                try {
                  localStorage.setItem('acl_adlc_project_markdown_files', JSON.stringify([]));
                } catch (e) {}
                renderFileTree();
                loadEmptyState();
                setSyncStatus('Synced with VS code and Github (0 files in _acl-output)', 'green');
                return true;
              }

              const normIncoming = filteredFiles.map((f) => ({
                ...f,
                status:
                  f.status === 'Accepted' || f.status === 'approved' || f.status === 'Approved' ? 'Approved' : f.status || 'In Review',
              }));

              const prevFingerprint = JSON.stringify(
                files.map((f) => ({
                  id: f.id,
                  filename: f.filename,
                  folderPath: f.folderPath,
                  content: f.content,
                  status: f.status,
                  tier: f.tier,
                })),
              );
              const nextFingerprint = JSON.stringify(
                normIncoming.map((f) => ({
                  id: f.id,
                  filename: f.filename,
                  folderPath: f.folderPath,
                  content: f.content,
                  status: f.status,
                  tier: f.tier,
                })),
              );
              const hasChanged = prevFingerprint !== nextFingerprint;

              if (hasChanged || files.length === 0) {
                const prevActiveFile = files.find((f) => f.id === activeFileId);
                files = normIncoming;
                try {
                  localStorage.setItem('acl_adlc_project_markdown_files', JSON.stringify(files));
                } catch (e) {}
                if (!activeFileId || !files.some((f) => f.id === activeFileId && !isChildFile(f.filename, f.folderPath))) {
                  activeFileId = getInitialActiveFileId(files);
                }
                renderFileTree();
                const currentActiveFile = files.find((f) => f.id === activeFileId);
                const activeContentChanged = !prevActiveFile || (currentActiveFile && prevActiveFile.content !== currentActiveFile.content);
                if (activeFileId && !isDirty && activeContentChanged) {
                  loadFile(activeFileId);
                }
                if (activeAppView === 'dashboard' || activeAppView === 'dashboard-summarized') {
                  renderDeliveryDashboard();
                } else if (activeAppView === 'dashboard-scrum') {
                  renderScrumMasterDashboard();
                } else if (activeAppView === 'dashboard-developer') {
                  renderDeveloperDashboard();
                }
              }
              if (data && data.source === 'github') {
                setSyncStatus(`Synced live with GitHub (${data.repo || 'origin'})`, 'green');
              } else {
                setSyncStatus('Synced with VS code and Github', 'green');
              }
              evaluateProceedButton();
              return true;
            }
          }
        } catch (e) {
        } finally {
          isSyncing = false;
        }
        evaluateProceedButton();
        return false;
      }

      let activeWorkflowMode = localStorage.getItem('acl_workflow_mode') || 'greenfield';

      function updateWorkflowModeUI() {
        const isBrownfield = activeWorkflowMode === 'brownfield';
        const icon = document.getElementById('workflowModeIcon');
        const text = document.getElementById('workflowModeText');
        if (icon) icon.textContent = isBrownfield ? '🍂' : '🌱';
        if (text) text.textContent = isBrownfield ? 'Brownfield' : 'Greenfield';
      }

      function selectWorkflowMode(mode, e) {
        if (e) e.stopPropagation();
        activeWorkflowMode = mode;
        localStorage.setItem('acl_workflow_mode', mode);
        updateWorkflowModeUI();
        closeWorkflowDropdown();
        showToast(`Switched workflow mode to: ${mode === 'brownfield' ? 'Brownfield' : 'Greenfield'}`, 'info');
        evaluateProceedButton();
      }

      function openWorkflowDiagramModal(e) {
        if (e) e.stopPropagation();
        closeWorkflowDropdown();
        openWorkflowModal(activeWorkflowMode);
      }

      async function init() {
        try {
          const cached = localStorage.getItem('acl_adlc_project_markdown_files');
          if (cached) {
            const parsed = JSON.parse(cached);
            if (Array.isArray(parsed)) {
              const sanitized = parsed.filter((f) => !isChildFile(f.filename, f.folderPath));
              localStorage.setItem('acl_adlc_project_markdown_files', JSON.stringify(sanitized));
            }
          }
          const savedActive = localStorage.getItem('acl_active_file_id');
          if (savedActive && (savedActive.toLowerCase().includes('memlog') || savedActive.startsWith('.'))) {
            localStorage.removeItem('acl_active_file_id');
            activeFileId = null;
          }
        } catch (e) {}

        try {
          const savedSort = localStorage.getItem('acl_file_tree_sort');
          if (savedSort && document.getElementById('sortSelect')) {
            document.getElementById('sortSelect').value = savedSort;
          }
        } catch (e) {}
        updateDrawerFrameworkVersion();
        updateWorkflowModeUI();
        const synced = await syncFromLiveDisk(true);

        if (!synced && files.length === 0) {
          try {
            const cached = localStorage.getItem('acl_adlc_project_markdown_files');
            if (cached) {
              const parsed = JSON.parse(cached);
              if (Array.isArray(parsed) && parsed.length > 0) {
                files = parsed
                  .filter((f) => !isChildFile(f.filename, f.folderPath))
                  .map((f) => ({
                    ...f,
                    status: f.status === 'Accepted' || f.status === 'approved' ? 'Approved' : f.status || 'In Review',
                  }));
              }
            }
          } catch (e) {}

          if (files.length === 0 && Array.isArray(window.__ACL_EMBEDDED_FILES__) && window.__ACL_EMBEDDED_FILES__.length > 0) {
            files = window.__ACL_EMBEDDED_FILES__
              .filter((f) => !isChildFile(f.filename, f.folderPath))
              .map((f) => ({
                ...f,
                status: f.status === 'Accepted' || f.status === 'approved' ? 'Approved' : f.status || 'In Review',
              }));
          }

          if (files.length > 0) {
            if (!activeFileId || !files.some((f) => f.id === activeFileId && !isChildFile(f.filename, f.folderPath))) {
              activeFileId = getInitialActiveFileId(files);
            }
            renderFileTree();
            if (activeFileId) {
              loadFile(activeFileId);
            }
          } else {
            renderFileTree();
            loadEmptyState();
          }
        }

        // NO background polling or window-focus triggers: files sync strictly on initial load, manual Sync button, or file save.
      }

      async function saveCurrentFile() {
        const file = getActiveFile();
        if (!file) return;

        const content = document.getElementById('markdownTextarea').value;
        const status = document.getElementById('statusSelect').value;
        const nowIso = new Date().toISOString();

        file.content = content;
        file.status = status;
        file.updatedAt = nowIso;

        renderPreview();
        try {
          localStorage.setItem('acl_adlc_project_markdown_files', JSON.stringify(files));
        } catch (e) {}

        // Save to disk locally or commit to GitHub if hosted on Vercel
        isSaving = true;
        try {
          const cloudToken = (localStorage.getItem('acl_github_token') || '').trim();
          const cloudOwner = (localStorage.getItem('acl_github_owner') || '').trim();
          const cloudRepo = (localStorage.getItem('acl_github_repo') || '').trim();
          const cloudBranch = (localStorage.getItem('acl_github_branch') || '').trim();

          const headers = { 'Content-Type': 'application/json' };
          if (cloudToken) {
            headers['Authorization'] = 'Bearer ' + cloudToken;
            headers['X-GitHub-Token'] = cloudToken;
          }

          const bodyPayload = {
            folderPath: file.folderPath,
            filename: file.filename,
            content: file.content,
            status: file.status,
            autoPush: false,
            githubToken: cloudToken || undefined,
            githubOwner: cloudOwner || undefined,
            githubRepo: cloudRepo || undefined,
            githubBranch: cloudBranch || undefined,
          };

          const saveEndpoint = (window.__ACL_LIVE_ENDPOINT__ || '') + '/api/save-markdown';
          const resp = await fetch(saveEndpoint, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(bodyPayload),
          });
          const resData = await resp.json().catch(() => ({}));
          if (resp.ok && resData.success !== false) {
            lastSaveTime = Date.now();
            if (resData && resData.repo) {
              setSyncStatus(`Committed to GitHub (${resData.repo}@${resData.branch || 'main'}) ✔`, 'green');
            } else {
              setSyncStatus('Saved locally to disk, VS Code & Github ✔', 'green');
            }
          } else {
            const errorMsg = resData.error || resData.message || `Server error (${resp.status})`;
            showToast(`Save failed: ${errorMsg}`, 'error');
            setSyncStatus(`Save failed: ${errorMsg}`, 'red');

            return false;
          }
        } catch (e) {
          showToast(`Save network error: ${e.message}`, 'error');
          setSyncStatus(`Network error: ${e.message}`, 'red');
          return false;
        } finally {
          isSaving = false;
        }

        isDirty = false;

        if (status === 'Approved' || status === 'Accepted') {
          showToast(`🎉 Approved '${file.filename}'!`, 'success');
        } else if (status === 'Rejected') {
          showToast(`🔴 Rejected '${file.filename}'`, 'error');
        } else {
          showToast(`Saved '${file.filename}' [${status}]`, 'info');
        }
        renderFileTree();
        evaluateProceedButton();
        if (activeAppView === 'dashboard') {
          renderDeliveryDashboard();
        }
        return true;
      }

      function updateDocumentStatusFrontmatter(content, newStatus, nowIso = new Date().toISOString()) {
        let cleanStatus = (newStatus || 'In Review').trim();
        if (cleanStatus.toLowerCase() === 'accepted') cleanStatus = 'Approved';
        const gateSig = 'ACL-STUDIO-APPROVAL-' + cleanStatus.toUpperCase().replace(/\s+/g, '-');
        const managedKeys = ['status', 'reviewed_by', 'review_timestamp', 'review_source', 'gate_signature'];

        if (content.startsWith('---')) {
          const parts = content.split('---');
          if (parts.length >= 3) {
            const fmRaw = parts[1];
            const body = parts.slice(2).join('---');

            const fmLines = fmRaw.split(/\r?\n/).filter((line) => {
              const trimmed = line.trim();
              if (!trimmed) return false;
              return !managedKeys.some((key) => new RegExp('^' + key + '\\s*:', 'i').test(trimmed));
            });

            const newFmLines = [
              'status: ' + cleanStatus,
              'reviewed_by: Manager (via Markdown Studio)',
              'review_timestamp: ' + nowIso,
              'gate_signature: ' + gateSig,
              ...fmLines,
            ];

            return '---\n' + newFmLines.join('\n') + '\n---' + (body.startsWith('\n') ? body : '\n' + body);
          }
        }

        const contentLines = content.split(/\r?\n/).filter((line) => {
          const trimmed = line.trim();
          return !managedKeys.some((key) => new RegExp('^' + key + '\\s*:', 'i').test(trimmed));
        });

        const cleanBody = contentLines.join('\n').trimStart();

        return (
          '---\nstatus: ' +
          cleanStatus +
          '\nreviewed_by: Manager (via Markdown Studio)\nreview_timestamp: ' +
          nowIso +
          '\ngate_signature: ' +
          gateSig +
          '\n---\n\n' +
          cleanBody
        );
      }

      async function onStatusChange(newStatus) {
        const file = getActiveFile();
        if (!file) return;

        const prevStatus = file.status;
        file.status = newStatus;
        const nowIso = new Date().toISOString();
        file.updatedAt = nowIso;

        const currentContent = document.getElementById('markdownTextarea').value || '';
        const updatedContent = updateDocumentStatusFrontmatter(currentContent, newStatus, nowIso);

        document.getElementById('markdownTextarea').value = updatedContent;
        file.content = updatedContent;

        const ok = await saveCurrentFile();
        if (ok === false) {
          file.status = prevStatus;
          const sel = document.getElementById('statusSelect');
          if (sel) {
            sel.value = prevStatus === 'Accepted' || prevStatus === 'approved' ? 'Approved' : prevStatus;
          }
          renderFileTree();
          return;
        }

        // Update status pill on active file in sidebar
        const root = document.getElementById('fileTreeRoot');
        if (root) {
          const activeItem = root.querySelector(`.file-item[data-file-id="${file.id}"]`);
          if (activeItem) {
            const pill = activeItem.querySelector('.status-pill');
            if (pill) {
              const normStatus = newStatus === 'Accepted' || newStatus === 'approved' ? 'Approved' : newStatus;
              pill.className = `status-pill ${normStatus.toLowerCase().replace(/\s+/g, '-')}`;
              pill.innerHTML = `<span class="dot"></span>${normStatus}`;
            }
          }
        }
      }

      function handleSortChange() {
        const sel = document.getElementById('sortSelect');
        if (sel) {
          try {
            localStorage.setItem('acl_file_tree_sort', sel.value);
          } catch (e) {}
        }
        activeFileId = getInitialActiveFileId(files);
        renderFileTree();
        if (activeFileId) {
          loadFile(activeFileId);
        }
      }

      function compareStoriesAndFiles(a, b) {
        if (!a || !b) return 0;
        const nameA = a.filename || '';
        const nameB = b.filename || '';
        // Extract epic/story numbers: e.g. story-1-1 or story-1.1
        const matchA = nameA.match(/story[_-](\d+)[-.](\d+)/i);
        const matchB = nameB.match(/story[_-](\d+)[-.](\d+)/i);
        if (matchA && matchB) {
          const epicA = parseInt(matchA[1], 10);
          const epicB = parseInt(matchB[1], 10);
          if (epicA !== epicB) return epicA - epicB;
          const storyA = parseInt(matchA[2], 10);
          const storyB = parseInt(matchB[2], 10);
          if (storyA !== storyB) return storyA - storyB;
        }
        // Spec numbers: e.g. spec-1, spec-2
        const specA = nameA.match(/spec[_-](\d+)/i);
        const specB = nameB.match(/spec[_-](\d+)/i);
        if (specA && specB) {
          const numA = parseInt(specA[1], 10);
          const numB = parseInt(specB[1], 10);
          if (numA !== numB) return numA - numB;
        }
        // Fallback to natural numeric collation
        return nameA.localeCompare(nameB, undefined, { numeric: true, sensitivity: 'base' });
      }

      function sortFilesList(fileList) {
        const sortSelect = document.getElementById('sortSelect');
        const sortType = (sortSelect && sortSelect.value) || 'alpha-asc';
        return [...fileList].sort((a, b) => {
          if (sortType === 'alpha-asc') {
            return compareStoriesAndFiles(a, b);
          }
          if (sortType === 'alpha-desc') {
            return compareStoriesAndFiles(b, a);
          }
          if (sortType === 'date-desc') {
            return (new Date(b.createdAt || b.updatedAt) - new Date(a.createdAt || a.updatedAt)) || compareStoriesAndFiles(a, b);
          }
          if (sortType === 'date-asc') {
            return (new Date(a.createdAt || a.updatedAt) - new Date(b.createdAt || b.updatedAt)) || compareStoriesAndFiles(a, b);
          }
          return compareStoriesAndFiles(a, b);
        });
      }

      function getInitialActiveFileId(fileList) {
        if (!fileList || fileList.length === 0) return null;
        const validFiles = (fileList || []).filter((f) => f && !isChildFile(f.filename, f.folderPath));
        if (validFiles.length === 0) return null;

        const sortedFiles = sortFilesList(validFiles);
        return sortedFiles[0] ? sortedFiles[0].id : null;
      }

      function formatFolderDisplayName(folderPath, folderFiles = []) {
        if (!folderPath) return 'Project Context';
        const lower = folderPath.toLowerCase();

        // 1. PHYSICAL FOLDER PATH PRIORITY (Option 1)
        // If the file lives in the implementation folder, it ALWAYS belongs to Project Implementation
        if (
          lower.includes('implementation') ||
          lower.includes('4-implementation') ||
          lower.includes('dev-auto')
        ) {
          return 'Project Implementation';
        }

        // If the file lives in QA / Testing folder, it ALWAYS belongs to Project QA
        if (
          lower.includes('qa') ||
          lower.includes('e2e') ||
          lower.includes('test') ||
          lower.includes('validate')
        ) {
          return 'Project QA';
        }

        // If the file lives in Solutioning / Epics folder, it ALWAYS belongs to Project Epics & Stories
        if (
          lower.includes('acl-create-epics') ||
          lower.includes('epics-and-stories') ||
          lower.includes('3b-') ||
          (lower.includes('3-solutioning') && !lower.includes('architecture'))
        ) {
          return 'Project Epics & Stories';
        }

        // If the file lives in Architecture folder, it ALWAYS belongs to Project Architecture
        if (
          lower.includes('acl-architecture') ||
          lower.includes('architecture') ||
          lower.includes('3a-') ||
          lower.includes('spine')
        ) {
          return 'Project Architecture';
        }

        // If the file lives in UX / Design folder, it ALWAYS belongs to Project UX & Design
        if (
          lower.includes('ux-designs') ||
          lower.includes('ux') ||
          lower.includes('design') ||
          lower.includes('figma') ||
          lower.includes('experience')
        ) {
          return 'Project UX & Design';
        }

        // If the file lives in PRD / Planning folder, it ALWAYS belongs to Project PRD
        if (
          lower.includes('acl-prd') ||
          lower.includes('prd') ||
          lower.includes('2-plan')
        ) {
          return 'Project PRD';
        }

        // If the file lives in Analysis / Product Brief folder, it ALWAYS belongs to Project Brief
        if (
          lower.includes('acl-product-brief') ||
          lower.includes('product-brief') ||
          lower.includes('1-analysis') ||
          lower.includes('brief')
        ) {
          return 'Project Brief';
        }

        // 2. FALLBACK BY FILENAME (for root _acl-output/ or flat folder structures)
        const filenames = (folderFiles || []).map((f) => (f.filename || '').toLowerCase());
        const hasBrief = filenames.some((n) => n === 'brief.md' || n.startsWith('brief-') || n.includes('product-brief'));
        const hasPrd = filenames.some((n) => n === 'prd.md' || n.startsWith('prd-') || n.includes('reconcile-brief'));
        const hasArch = filenames.some((n) => n.includes('architecture') || n.includes('spine'));
        const hasUx = filenames.some((n) => n === 'ux.md' || n.startsWith('ux-') || n === 'design.md' || n.includes('experience') || n.includes('figma'));
        const hasEpics = filenames.some((n) => n === 'epics.md' || n.startsWith('epics-'));
        const hasStoriesOrSpecs = filenames.some((n) => n.startsWith('story-') || n.startsWith('spec-') || n.startsWith('step-'));
        const hasQA = filenames.some((n) => n === 'e2e-testing.md' || n === 'qa.md' || n.startsWith('test-'));

        if (hasStoriesOrSpecs) return 'Project Implementation';
        if (hasQA) return 'Project QA';
        if (hasEpics) return 'Project Epics & Stories';
        if (hasArch) return 'Project Architecture';
        if (hasUx) return 'Project UX & Design';
        if (hasPrd) return 'Project PRD';
        if (hasBrief) return 'Project Brief';

        if (
          lower.includes('context') ||
          lower === '0-context' ||
          lower === 'root' ||
          lower === '_acl-output' ||
          lower === 'acl-output' ||
          lower === '_acl_output' ||
          lower.endsWith('/_acl-output') ||
          lower.endsWith('/acl-output') ||
          filenames.some((n) => n.includes('context'))
        ) {
          return 'Project Context';
        }

        // Extract top-level domain folder under _acl-output or planning-artifacts
        const pathParts = folderPath.replace(/^.*(?:_acl-output|acl-output)\/?/, '').split('/').filter(Boolean);
        let domainFolder = pathParts[0] || folderPath.split('/').pop();
        if (domainFolder === 'planning-artifacts' && pathParts.length > 1) {
          domainFolder = pathParts[1];
        }
        const cleaned = domainFolder
          .replace(/^[0-9]+-/, '')
          .replace(/^[_]+/, '')
          .replace(/[-_]+/g, ' ')
          .trim();
        if (!cleaned || cleaned.toLowerCase() === 'acl output' || cleaned.toLowerCase() === 'acl coutput' || cleaned.toLowerCase() === 'deliverables') {
          return 'Project Context';
        }
        const capitalized = cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
        return `Project ${capitalized}`;
      }

      function getFileFolderGroup(file) {
        if (!file) return 'Project Context';
        return formatFolderDisplayName(file.folderPath, [file]);
      }

      function getSubfolderTag(file, primaryFolder) {
        if (!file || !file.folderPath || file.folderPath === 'root') return '';
        const normFile = file.folderPath.replace(/\\/g, '/');
        const normPrimary = (primaryFolder || '').replace(/\\/g, '/');
        if (normPrimary && normFile.startsWith(normPrimary) && normFile.length > normPrimary.length) {
          const sub = normFile.slice(normPrimary.length).replace(/^\/+/, '');
          if (sub) return sub;
        }
        const match = normFile.match(/\/(imports|assets|diagrams|sources|specs|mockups|research|components|data)$/i);
        if (match) return match[1].toLowerCase();
        return '';
      }

      const CANONICAL_FOLDER_ORDER = [
        'Project Context',
        'Project Brief',
        'Project PRD',
        'Project Architecture',
        'Project UX & Design',
        'Project Epics & Stories',
        'Project Implementation',
        'Project QA',
      ];

      function formatFileDisplayName(filename, folderPath = '', doc = null) {
        if (!filename) return '';
        const lower = filename.toLowerCase();
        const folderLower = (folderPath || '').toLowerCase();
        const isImplementationFolder =
          folderLower.includes('implementation') ||
          folderLower.includes('4-implementation') ||
          folderLower.includes('dev-auto');

        // If inside implementation folder, prevent accidental hijacking by UX/Architecture/Brief/PRD keywords
        if (!isImplementationFolder) {
          // Project Brief
          if (lower === 'brief.md' || lower.startsWith('brief-') || lower.includes('product-brief')) {
            return 'Project Brief';
          }

          // PRD
          if (lower === 'prd.md' || lower.startsWith('prd-')) {
            return 'Project PRD';
          }

          // Context - only exact project-context.md or context.md
          if (lower === 'project-context.md' || lower === 'context.md') {
            return 'Project Context';
          }

          // Architecture
          if (lower.includes('architecture') || lower.includes('spine')) {
            return 'Project Architecture';
          }

          // Project QA / E2E Testing
          if (lower === 'e2e-testing.md' || lower === 'qa.md' || lower.includes('e2e') || lower.includes('testing')) {
            return 'Project QA';
          }

          // UX / Design / Experience
          if (lower.includes('experience')) {
            return 'Project Experience';
          }
          if (lower === 'ux.md' || lower.startsWith('ux-') || lower.includes('design')) {
            return 'Project Design';
          }

          // Epics
          if (lower === 'epics.md' || lower.includes('epics')) {
            return 'Project Epics & Stories';
          }
        }

        // Story files & Implementation specs: story-1-1.md, story-1.1.md, spec-1-2-...
        const storyNumMatch = filename.match(/^(?:story|spec)[-_]?(\d+)[\.-](\d+)(?:[-_].*)?\.md$/i);
        if (storyNumMatch) {
          return `Story ${storyNumMatch[1]}.${storyNumMatch[2]}`;
        }

        const directStoryMatch = filename.match(/^story\s*(\d+)[\.-](\d+)\.md$/i);
        if (directStoryMatch) {
          return `Story ${directStoryMatch[1]}.${directStoryMatch[2]}`;
        }

        const singleStoryMatch = filename.match(/^story[-_]?(\d+)(?:[-_].*)?\.md$/i);
        if (singleStoryMatch) {
          return `Story ${singleStoryMatch[1]}`;
        }

        // Step files: step-01-scaffold.md
        const stepMatch = filename.match(/^step[-_](\d+)(?:[-_](.*))?\.md$/i);
        if (stepMatch) {
          const stepNum = stepMatch[1];
          const suffix = stepMatch[2] ? stepMatch[2].replace(/[-_]+/g, ' ').trim() : '';
          if (suffix) {
            const formattedSuffix = suffix
              .split(' ')
              .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
              .join(' ');
            return `Step ${stepNum}: ${formattedSuffix}`;
          }
          return `Step ${stepNum}`;
        }

        // Other spec files: spec-<slug>.md
        const specMatch = filename.match(/^spec[-_](.+)\.md$/i);
        if (specMatch) {
          const formattedSpec = specMatch[1]
            .replace(/[-_]+/g, ' ')
            .split(' ')
            .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
            .join(' ');
          return `Spec: ${formattedSpec}`;
        }

        // Generic markdown fallback: strip .md and title-case words
        if (filename.endsWith('.md')) {
          const base = filename.slice(0, -3).replace(/[-_]+/g, ' ');
          return base
            .split(' ')
            .filter(Boolean)
            .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
            .join(' ');
        }

        return filename;
      }

      function renderFileTree() {
        const root = document.getElementById('fileTreeRoot');
        const searchQuery = (document.getElementById('searchInput').value || '').toLowerCase();
        const filterStatus = document.getElementById('filterStatusSelect').value;

        root.innerHTML = '';

        let filtered = files.filter((file) => {
          if (isChildFile(file.filename, file.folderPath)) {
            return false;
          }
          const matchesSearch =
            file.filename.toLowerCase().includes(searchQuery) || (file.folderPath || '').toLowerCase().includes(searchQuery);
          const currentNormStatus = file.status === 'Accepted' ? 'Approved' : file.status;
          const matchesStatus = filterStatus === 'all' || currentNormStatus === filterStatus || file.status === filterStatus;
          return matchesSearch && matchesStatus;
        });

        if (filtered.length === 0) {
          root.innerHTML =
            '<div style="text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.85rem;">No markdown files found.</div>';
          return;
        }

        // Sort FILES directly (filter and sort applies to files, not folders)
        filtered = sortFilesList(filtered);

        // Group into folders based on resolved display name (Option 1 aggregation)
        const groups = {};
        const folderOrder = [];
        const groupMeta = {};

        filtered.forEach((file) => {
          const groupName = getFileFolderGroup(file);
          if (!groups[groupName]) {
            groups[groupName] = [];
            folderOrder.push(groupName);
            groupMeta[groupName] = {
              displayName: groupName,
              primaryFolderPath: file.folderPath || 'root',
            };
          }
          groups[groupName].push(file);
        });

        // Canonical lifecycle ordering
        folderOrder.sort((a, b) => {
          const indexA = CANONICAL_FOLDER_ORDER.indexOf(a);
          const indexB = CANONICAL_FOLDER_ORDER.indexOf(b);
          if (indexA !== -1 && indexB !== -1) return indexA - indexB;
          if (indexA !== -1) return -1;
          if (indexB !== -1) return 1;
          return a.localeCompare(b);
        });

        // The first file in the sorted list is the primary default
        if (!activeFileId || !filtered.some((f) => f.id === activeFileId)) {
          activeFileId = filtered[0].id;
        }

        // Auto-open active file folder if no folder is open yet
        const currentActiveDoc = files.find((f) => f.id === activeFileId);
        if (currentActiveDoc && openFolders.size === 0) {
          const activeGroup = getFileFolderGroup(currentActiveDoc);
          if (activeGroup) openFolders.add(activeGroup);
        }

        folderOrder.forEach((folderName) => {
          const folderDiv = document.createElement('div');
          folderDiv.className = 'folder-item';

          const headerDiv = document.createElement('div');
          headerDiv.className = 'folder-header';

          const folderFiles = groups[folderName];
          folderFiles.sort(compareStoriesAndFiles);
          const fileCountText = folderFiles.length === 1 ? '1 file' : `${folderFiles.length} files`;
          const latestDate = folderFiles.reduce((latest, f) => {
            const d = new Date(f.updatedAt || f.createdAt);
            return d > latest ? d : latest;
          }, new Date(0));
          const formattedFolderTime = formatFileDateTime(latestDate.toISOString());
          const meta = groupMeta[folderName] || {};
          const primaryPath = meta.primaryFolderPath || folderName;

          headerDiv.setAttribute(
            'title',
            `Folder: ${folderName}\nLocation: _acl-output/${primaryPath}\nContains: ${fileCountText}\nLast Updated: ${formattedFolderTime}`,
          );

          const isOpen = searchQuery !== '' ? true : openFolders.has(folderName);

          headerDiv.innerHTML = `
          <div class="folder-title-left">
            <span class="folder-chevron ${isOpen ? '' : 'collapsed'}">▼</span>
            <span>📁 ${folderName}</span>
          </div>
          <span class="folder-badge">${folderFiles.length}</span>
        `;

          const filesDiv = document.createElement('div');
          filesDiv.className = `folder-files-list ${isOpen ? '' : 'hidden'}`;

          headerDiv.addEventListener('click', () => {
            const isCurrentlyHidden = filesDiv.classList.contains('hidden');
            if (isCurrentlyHidden) {
              openFolders.clear();
              openFolders.add(folderName);
            } else {
              openFolders.delete(folderName);
            }
            renderFileTree();
          });

          folderFiles.forEach((file) => {
            const fileDiv = document.createElement('div');
            fileDiv.dataset.fileId = file.id;
            fileDiv.className = `file-item ${file.id === activeFileId ? 'active' : ''}`;
            fileDiv.onclick = () => loadFile(file.id);

            const normStatus =
              file.status === 'Accepted' || file.status === 'approved' || file.status === 'Approved'
                ? 'Approved'
                : file.status || 'In Review';
            const statusClass = normStatus.toLowerCase().replace(/\s+/g, '-');
            const fullPath =
              file.fullPath || (file.folderPath && file.folderPath !== 'root' ? `${file.folderPath}/${file.filename}` : file.filename);
            const formattedTime = formatFileDateTime(file.createdAt || file.updatedAt);
            const subfolderTag = getSubfolderTag(file, primaryPath);

            fileDiv.setAttribute(
              'title',
              `File: ${file.filename}\nLocation: ${file.folderPath || 'root'}\nFull Path: ${fullPath}\nCreated: ${formattedTime}\nStatus: ${normStatus}`,
            );

            fileDiv.innerHTML = `
            <div class="file-item-left">
              <span class="file-icon">📄</span>
              <span>${formatFileDisplayName(file.filename, file.folderPath, file)}</span>
              ${subfolderTag ? `<span class="subfolder-tag" style="font-size: 0.65rem; font-weight: 600; opacity: 0.65; margin-left: 6px; padding: 1px 5px; border-radius: 4px; background: rgba(148, 163, 184, 0.2); text-transform: uppercase; letter-spacing: 0.4px;">${subfolderTag}</span>` : ''}
            </div>
            <span class="status-pill ${statusClass}">
              <span class="dot"></span>
              ${normStatus}
            </span>
          `;

            filesDiv.appendChild(fileDiv);
          });

          folderDiv.appendChild(headerDiv);
          folderDiv.appendChild(filesDiv);
          root.appendChild(folderDiv);
        });
      }

      function loadFile(id, openFolder = false) {
        if (!id) return;
        let file = (files || []).find((f) => f.id === id);
        if (!file) {
          const fn = id.replace(/^\.\//, '').toLowerCase();
          file = (files || []).find(
            (f) => f.filename.toLowerCase() === fn || f.id.toLowerCase() === fn || (f.fullPath && f.fullPath.toLowerCase().endsWith(fn)),
          );
        }
        if (!file) {
          const fallbackId = getInitialActiveFileId(files);
          if (fallbackId && fallbackId !== id) {
            loadFile(fallbackId, openFolder);
            return;
          }
          if (!file) {
            loadEmptyState();
            return;
          }
        }
        activeFileId = file.id;
        if (openFolder) {
          openFolders.clear();
          openFolders.add(getFileFolderGroup(file));
          renderFileTree();
        }

        const statusSelect = document.getElementById('statusSelect');
        statusSelect.disabled = false;
        statusSelect.value = file.status === 'Accepted' ? 'Approved' : file.status;

        const textarea = document.getElementById('markdownTextarea');
        textarea.readOnly = false;
        textarea.value = file.content;

        renderPreview();
        isDirty = false;
        evaluateProceedButton();

        // Highlight selected file in left sidebar
        const root = document.getElementById('fileTreeRoot');
        if (root) {
          root.querySelectorAll('.file-item').forEach((item) => {
            if (item.dataset.fileId === id) {
              item.classList.add('active');
            } else {
              item.classList.remove('active');
            }
          });
        }
      }

      function getActiveFile() {
        const file = files.find((f) => f.id === activeFileId);
        if (file && !isChildFile(file.filename, file.folderPath)) {
          return file;
        }
        const fallbackId = getInitialActiveFileId(files);
        if (fallbackId) {
          activeFileId = fallbackId;
          return files.find((f) => f.id === fallbackId) || null;
        }
        return null;
      }

      function renderPreview() {
        const file = getActiveFile();
        if (!file) return;

        const previewEl = document.getElementById('markdownPreview');
        let displayContent = document.getElementById('markdownTextarea').value || '';
        if (displayContent.startsWith('---')) {
          const parts = displayContent.split('---');
          if (parts.length >= 3) {
            displayContent = parts.slice(2).join('---').trim();
          }
        }

        if (typeof marked !== 'undefined') {
          previewEl.innerHTML = marked.parse(displayContent);
          if (typeof hljs !== 'undefined') {
            previewEl.querySelectorAll('pre code').forEach((block) => {
              hljs.highlightElement(block);
            });
          }
        } else {
          previewEl.textContent = displayContent;
        }
      }

      const WORKFLOW_SVGS = {
        greenfield: {
          title: 'Greenfield Delivery Workflow',

          fallbackUrl: '/greenfield.svg',
        },
        brownfield: {
          title: 'Brownfield Delivery Workflow',

      };

      let workflowZoomLevel = 1;
      let workflowPanX = 0;
      let workflowPanY = 0;
      let isPanningWorkflow = false;
      let panStartX = 0;
      let panStartY = 0;

      function applyWorkflowTransform() {
        const wrapper = document.getElementById('workflowSvgWrapper');
        if (wrapper) {
          wrapper.style.transform = 'translate(' + workflowPanX + 'px, ' + workflowPanY + 'px) scale(' + workflowZoomLevel + ')';

      function toggleWorkflowDropdown(e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById('workflowMenu');
        const btn = document.getElementById('btnWorkflow');
        if (menu) {
          const isShown = menu.classList.toggle('show');
          if (btn) {
            if (isShown) btn.classList.add('active');
            else btn.classList.remove('active');
          }
        }
      }

      function closeWorkflowDropdown() {
        const menu = document.getElementById('workflowMenu');
        const btn = document.getElementById('btnWorkflow');
        if (menu) menu.classList.remove('show');
        if (btn) btn.classList.remove('active');
      }

      function openWorkflowModal(type, e) {
        if (e) e.stopPropagation();
        closeWorkflowDropdown();

        const data = WORKFLOW_SVGS[type] || WORKFLOW_SVGS.greenfield;
        if (!data) return;

        workflowZoomLevel = 1;
        workflowPanX = 0;
        workflowPanY = 0;

        const modal = document.getElementById('workflowModal');
        const img = document.getElementById('workflowSvgImg');

        if (img) {
          img.onerror = function () {
            try {
              const fallbackFull = new URL(data.fallbackUrl, window.location.href).href;
              if (this.src !== fallbackFull) {
                this.src = data.fallbackUrl;
              }
            } catch {
              this.src = data.fallbackUrl;
            }
          };
          img.src = data.url;
          img.alt = data.title;
        }
        applyWorkflowTransform();

        if (modal) {
          modal.classList.add('open');
        }
        document.body.style.overflow = 'hidden';
      }

      function closeWorkflowModal(e) {
        if (e && e.target && e.target.closest && e.target.closest('.workflow-modal-card') && !e.target.closest('.workflow-close-btn')) {
          return;
        }

        const modal = document.getElementById('workflowModal');
        if (modal) {
          modal.classList.remove('open');
        }
        const img = document.getElementById('workflowSvgImg');
        if (img) {
          img.src = '';
        }
        document.body.style.overflow = '';
        closeWorkflowDropdown();
      }

      function zoomWorkflow(delta) {
        if (delta === 0) {
          workflowZoomLevel = 1;
          workflowPanX = 0;
          workflowPanY = 0;
        } else {
          workflowZoomLevel = Math.min(Math.max(workflowZoomLevel + delta, 0.4), 4.0);
        }
        applyWorkflowTransform();
      }

      // Mouse wheel zoom inside modal
      document.addEventListener(
        'wheel',
        (e) => {
          const modal = document.getElementById('workflowModal');
          if (modal && modal.classList.contains('open')) {
            const body = document.getElementById('workflowModalBody');
            if (body && (body === e.target || body.contains(e.target))) {
              e.preventDefault();
              const delta = e.deltaY < 0 ? 0.15 : -0.15;
              zoomWorkflow(delta);
            }
          }
        },
        { passive: false },
      );

      // Drag-to-pan inside modal
      document.addEventListener('mousedown', (e) => {
        const modal = document.getElementById('workflowModal');
        if (modal && modal.classList.contains('open')) {
          const body = document.getElementById('workflowModalBody');
          if (body && (body === e.target || body.contains(e.target)) && !e.target.closest('.workflow-close-btn')) {
            isPanningWorkflow = true;
            panStartX = e.clientX - workflowPanX;
            panStartY = e.clientY - workflowPanY;
          }
        }
      });

      document.addEventListener('mousemove', (e) => {
        if (isPanningWorkflow) {
          workflowPanX = e.clientX - panStartX;
          workflowPanY = e.clientY - panStartY;
          applyWorkflowTransform();
        }
      });

      document.addEventListener('mouseup', () => {
        isPanningWorkflow = false;
      });

      document.addEventListener('click', (e) => {
        const wrapper = document.getElementById('workflowDropdownWrapper');
        if (wrapper && !wrapper.contains(e.target)) {
          closeWorkflowDropdown();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeNavDrawer();
          closeWorkflowModal();
        } else if (e.key === '+' || e.key === '=') {
          const modal = document.getElementById('workflowModal');
          if (modal && modal.classList.contains('open')) zoomWorkflow(0.2);
        } else if (e.key === '-') {
          const modal = document.getElementById('workflowModal');
          if (modal && modal.classList.contains('open')) zoomWorkflow(-0.2);
        } else if (e.key === '0') {
          const modal = document.getElementById('workflowModal');
          if (modal && modal.classList.contains('open')) zoomWorkflow(0);
        }
      });

      // ==========================================
      // Delivery Dashboard Engine (View-Only, 80/20 Weights)
      // ==========================================
      function parseEpicsAndStoriesFromMarkdown(markdownText, allFiles = []) {
        if (!markdownText) return [];
        const lines = markdownText.split(/\r?\n/);
        const epics = [];
        let currentEpic = null;
        let currentStory = null;
        let inAC = false;

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();

          // Match Epic header: ## Epic 1: ... or ## EPIC-1 ...
          // Must require a number to prevent matching "## Epic List", "## Epics Overview", etc.
          const epicMatch = line.match(/^##\s+(?:Epic\s*(\d+)[:\-\s]*|EPIC-(\d+)[:\-\s]*)(.+)$/i);
          if (epicMatch) {
            const epicNum = epicMatch[1] || epicMatch[2];
            const rawTitle = epicMatch[3].trim().replace(/^[:\-]\s*/, '');
            currentEpic = {
              num: epicNum,
              title: rawTitle,
              stories: [],
            };
            epics.push(currentEpic);
            currentStory = null;
            inAC = false;
            continue;
          }

          // Match Story header, checkbox item, bold bullet item, or plain bullet item inside epic
          if (currentEpic) {
            const storyHeaderMatch = line.match(
              /^(?:###|####)\s*(?:\[([ xX])\]\s*)?(?:Story\s*([\d\.]+)[:\-\s]*|STORY-([\d\.]+)[:\-\s]*)(?:\[([ xX])\]\s*)?(.+)$/i,
            );
            const checkboxMatch = !inAC && line.match(/^-\s*\[([ xX])\]\s*(?:Story\s*([\d\.]+)[:\-\s]+|STORY-([\d\.]+)[:\-\s]+)(.+)$/i);
            const bulletBoldMatch =
              !inAC && line.match(/^(?:-\s*)?\*\*(?:\[([ xX])\]\s*)?(?:Story\s*([\d\.]+)[:\-\s]+|STORY-([\d\.]+)[:\-\s]+)(.+?)\*\*(.*)$/i);
            const bulletPlainMatch = !inAC && line.match(/^-\s*(?:Story\s*([\d\.]+)[:\-\s]+|STORY-([\d\.]+)[:\-\s]+)(.+)$/i);

            let sNum = null;
            let sTitle = null;
            let isCheckboxDone = false;

            if (storyHeaderMatch) {
              const cb1 = storyHeaderMatch[1];
              const cb2 = storyHeaderMatch[4];
              sNum = storyHeaderMatch[2] || storyHeaderMatch[3];
              const rawRest = (storyHeaderMatch[5] || '').trim().replace(/^[:\-]\s*/, '');
              const endCb = rawRest.match(/^\[([ xX])\]\s*(.+)$/i);
              if (endCb) {
                isCheckboxDone = endCb[1].toLowerCase() === 'x';
                sTitle = endCb[2].trim().replace(/^[:\-]\s*/, '');
              } else {
                isCheckboxDone = (cb1 && cb1.toLowerCase() === 'x') || (cb2 && cb2.toLowerCase() === 'x');
                sTitle = rawRest;
              }
            } else if (checkboxMatch) {
              isCheckboxDone = checkboxMatch[1].toLowerCase() === 'x';
              sNum = checkboxMatch[2];
              sTitle = checkboxMatch[3].trim().replace(/^[:\-]\s*/, '');
            } else if (bulletBoldMatch) {
              const cb1 = bulletBoldMatch[1];
              sNum = bulletBoldMatch[2] || bulletBoldMatch[3];
              const rest = (bulletBoldMatch[4] + (bulletBoldMatch[5] || '')).trim();
              isCheckboxDone = cb1 && cb1.toLowerCase() === 'x';
              sTitle = rest.replace(/^[:\-]\s*/, '');
            } else if (bulletPlainMatch) {
              sNum = bulletPlainMatch[1] || bulletPlainMatch[2];
              sTitle = bulletPlainMatch[3].trim().replace(/^[:\-]\s*/, '');
            }

            if (sTitle) {
              if (/[\(\[](?:done|completed)[\)\]]$/i.test(sTitle)) {
                isCheckboxDone = true;
                sTitle = sTitle.replace(/[\(\[](?:done|completed)[\)\]]$/i, '').trim();
              }

              let status = 'To Do';
              let isCompleted = false;
              let matchFile = null;

              // Cross-reference with live files in _acl-output
              if (Array.isArray(allFiles) && allFiles.length > 0) {
                const numSlug = sNum ? sNum.replace(/\./g, '-') : '';
                const dotSlug = sNum || '';
                matchFile = allFiles.find((f) => {
                  const fn = (f.filename || '').toLowerCase();
                  const fp = (f.fullPath || f.folderPath || f.path || '').toLowerCase();
                  if (!numSlug) return false;
                  const pattern = new RegExp(`(?:story|spec)[-_\\.]?${numSlug.replace(/-/g, '[-_\\.]')}(?![-_\\.]?\\d)`, 'i');
                  return (
                    pattern.test(fn) ||
                    pattern.test(fp) ||
                    fn.includes(`story-${numSlug}`) ||
                    fn.includes(`story-${dotSlug}`) ||
                    fn.includes(`spec-${numSlug}`) ||
                    fn.includes(`spec-${dotSlug}`)
                  );
                });

                if (matchFile) {
                  const raw = (matchFile.status || '').trim().toLowerCase();
                  if (raw.includes('accept') || raw.includes('approved') || raw.includes('final')) {
                    status = 'Approved';
                    isCompleted = true;
                  } else if (raw.includes('reject')) {
                    status = 'Rejected';
                    isCompleted = false;
                  } else {
                    status = 'In Review';
                    isCompleted = false;
                  }
                }
              }

              currentStory = {
                num: sNum,
                title: sTitle,
                status: status,
                isCompleted: isCompleted,
                fileId: matchFile ? matchFile.id : null,
                filename: matchFile ? matchFile.filename : null,
                acceptanceCriteria: [],
                hasFileAC: false,
              };

              // If matchFile has AC, try reading from matchFile content
              if (matchFile && matchFile.content) {
                const parsedAcs = parseAcceptanceCriteriaFromSpec(matchFile.content);
                if (parsedAcs && parsedAcs.length > 0) {
                  currentStory.acceptanceCriteria = parsedAcs;
                  currentStory.hasFileAC = true;
                }
              }

              currentEpic.stories.push(currentStory);
              inAC = false;
              continue;
            }

            // Gather Acceptance Criteria for currentStory from epics.md
            if (currentStory && !currentStory.hasFileAC) {
              if (line.match(/(?:\*\*|\*|#+\s*)Acceptance Criteria:?(?:\*\*|\*)?/i)) {
                inAC = true;
                const afterAc = line.replace(/^.*Acceptance Criteria:?(?:\*\*|\*)?\s*/i, '').trim();
                if (afterAc.length > 0) {
                  const checkMatch = afterAc.match(/^[-*]?\s*\[([ xX])\]\s*(.*)$/);
                  if (checkMatch) {
                    currentStory.acceptanceCriteria.push({
                      isCompleted: checkMatch[1].toLowerCase() === 'x',
                      text: checkMatch[2].trim(),
                    });
                  } else {
                    currentStory.acceptanceCriteria.push({
                      isCompleted: false,
                      text: afterAc.replace(/^[-*•]\s*/, '').trim(),
                    });
                  }
                }
                continue;
              }
              if (line.startsWith('---') || line.startsWith('##') || line.startsWith('###') || line.match(/^-\s*\*\*/)) {
                inAC = false;
              }
              if (inAC && line.length > 0) {
                const trimmed = line.trim();
                const checkMatch = trimmed.match(/^[-*]?\s*\[([ xX])\]\s*(.*)$/);
                if (checkMatch) {
                  currentStory.acceptanceCriteria.push({
                    isCompleted: checkMatch[1].toLowerCase() === 'x',
                    text: checkMatch[2].trim(),
                  });
                } else if (trimmed.match(/^[-*•]\s+/)) {
                  currentStory.acceptanceCriteria.push({
                    isCompleted: false,
                    text: trimmed.replace(/^[-*•]\s*/, '').trim(),
                  });
                } else if (trimmed.length > 0 && currentStory.acceptanceCriteria.length > 0) {
                  currentStory.acceptanceCriteria[currentStory.acceptanceCriteria.length - 1].text += ' ' + trimmed;
                }
              }
            }
          }
        }

        // Fallback: If no ## Epic headers were matched, look for stories anywhere
        if (epics.length === 0) {
          const fallbackStories = [];
          for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            const storyMatch = line.match(/^(?:###\s+Story\s*([\d\.]*)[:\-]?|###\s+|-\s*\[([ xX])\]\s*Story)\s*(.+)$/i);
            if (storyMatch) {
              const isDone = storyMatch[2] && storyMatch[2].toLowerCase() === 'x';
              fallbackStories.push({
                num: storyMatch[1] || null,
                title: storyMatch[3].trim(),
                status: isDone ? 'Approved' : 'To Do',
                isCompleted: isDone,
                fileId: null,
                filename: null,
                acceptanceCriteria: [],
              });
            }
          }
          if (fallbackStories.length > 0) {
            epics.push({
              num: '1',
              title: 'Implementation Backlog',
              stories: fallbackStories,
            });
          }
        }

        return epics;
      }

      let openAccordionEpicIndex = null;

      function formatStoryTitle(title) {
        if (!title) return '';
        return title
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(
            /`([^`]+)`/g,
            '<code style="background: #f1f5f9; padding: 0.1rem 0.35rem; border-radius: 4px; font-family: monospace; font-size: 0.85em; color: #475569;">$1</code>',
          );
      }

      function normalizeAcItem(ac) {
        if (!ac) return { isCompleted: false, text: '' };
        if (typeof ac === 'string') {
          const checkMatch = ac.match(/^\[([ xX])\]\s*(.*)$/);
          if (checkMatch) {
            return { isCompleted: checkMatch[1].toLowerCase() === 'x', text: checkMatch[2].trim() };
          }
          return { isCompleted: false, text: ac.replace(/^[•\-\*]\s*/, '').trim() };
        }
        return ac;
      }

      window.toggleEpicAccordion = function (index) {
        if (openAccordionEpicIndex === index) {
          openAccordionEpicIndex = null;
        } else {
          openAccordionEpicIndex = index;
        }
        openStoryKey = null;

        const groups = document.querySelectorAll('.epic-group');
        groups.forEach((group, idx) => {
          const gIdx = group.dataset.epicIndex !== undefined ? parseInt(group.dataset.epicIndex, 10) : idx;
          if (openAccordionEpicIndex !== null && openAccordionEpicIndex === gIdx) {
            group.classList.add('open');
          } else {
            group.classList.remove('open');
          }
        });

        const storyItems = document.querySelectorAll('.story-accordion-item');
        storyItems.forEach((item) => {
          item.classList.remove('open');
        });
      };

      function getProjectClassification() {
        const fileList = Array.isArray(files) ? files : [];
        const hasProjectContext = fileList.some((f) => {
          const fn = (f.filename || '').toLowerCase();
          const full = (f.fullPath || f.path || f.folderPath || '').toLowerCase();
          const pt = (f.projectType || '').toLowerCase();
          return fn === 'project-context.md' || fn.includes('project-context') || full.includes('project-context') || pt === 'brownfield';
        });
        if (hasProjectContext || activeWorkflowMode === 'brownfield') {
          return {
            type: 'brownfield',
            label: 'Brownfield',
            icon: '🍂',
            title: 'Brownfield Delivery Workflow',
          };
        }
        return {
          type: 'greenfield',
          label: 'Greenfield',
          icon: '🌱',
          title: 'Greenfield Delivery Workflow',
        };
      }

            return /^tier:\s*([^\n\r]+)/im.test(f.content);

          return false;

        if (fileWithTier) {
          const raw = fileWithTier.tier || fileWithTier.content.match(/^tier:\s*([^\n\r]+)/im)?.[1] || '';

          if (clean.includes('2') || clean.includes('major') || clean.includes('enterprise') || clean.includes('architecture')) return '2';
          if (clean.includes('1') || clean.includes('spec') || clean.includes('self-contained')) return '1';
        }
        const hasTier2Docs = (files || []).some((f) => {
          const fn = (f.filename || '').toLowerCase();
          const folder = (f.folderPath || '').toLowerCase();
          return (
            fn === 'epics.md' ||
            fn === 'architecture-spine.md' ||
            fn === 'prd.md' ||
            folder.includes('3-solutioning') ||
            folder.includes('2-plan-workflows') ||
            folder.includes('1-analysis')

        if (hasTier2Docs) return '2';
        const hasSpecDocs = (files || []).some((f) => {
          const fn = (f.filename || '').toLowerCase();
          return fn.startsWith('spec-') || fn.includes('spec');

        if (hasSpecDocs) return '1';

          const fn = (f.filename || '').toLowerCase();
          const full = ((f.folderPath || '') + '/' + (f.filename || '')).toLowerCase();
          if (typeof pattern === 'string') return fn.includes(pattern) || full.includes(pattern);
          return pattern.test(fn) || pattern.test(full);
        });
      }

      function isTestDeliverable(filename, folderPath) {
        const fn = (filename || '').toLowerCase();

          return false;

        if (fn.startsWith('spec-') || fn.startsWith('story-') || fn.includes('architecture')) return false;
        const folderHit = /(^|\/)(tests?|e2e|qa|validate(?:-and-release)?)(\/|$)/.test(folder);
        const nameHit =
          /(e2e|testing|test-summary|qa-tests?)/.test(fn) || /^tests?[-_].+\.md$/.test(fn) || /[-_](e2e|tests?)\.md$/.test(fn);
        return folderHit || nameHit;

      function getSpecDocs() {
        return (files || []).filter((f) => {
          const fn = (f.filename || '').toLowerCase();
          const folder = (f.folderPath || '').toLowerCase();
          const isCandidate =
            (fn.startsWith('spec-') || fn.includes('spec') || folder.includes('4-implementation') || folder.includes('spec')) &&
            fn.endsWith('.md') &&
            !fn.includes('brief') &&
            !fn.includes('prd') &&
            !fn.includes('spine') &&
            !fn.includes('epics') &&
            !fn.includes('project-context');
          if (!isCandidate) return false;

          // Exclude Tier 2 specs: Tier 2 features are implemented through Phase 4 Epics and Stories
          if (f.tier === '2' || f.tier === 2) return false;
          const content = f.content || '';
          if (/tier:\s*['"]?.*(?:2|major|enterprise|architecture)/i.test(content)) return false;
          if (/epics\.md/i.test(content) || /architecture-spine/i.test(content)) return false;

          // Only Tier 1 standalone / self-contained specs are included
          if (f.tier === '1' || f.tier === 1) return true;
          if (/tier:\s*['"]?.*(?:1|self-contained|standalone)/i.test(content)) return true;
          if (/self[- ]contained/i.test(content) || /standalone/i.test(content)) return true;

          // Fallback: If epics.md exists in project (Tier 2 active), exclude unbadged specs from standalone
          const hasEpicsInProject = (files || []).some((file) => (file.filename || '').toLowerCase().includes('epics.md'));
          if (hasEpicsInProject) {
            return false;
          }

          return true;
        });
      }

      function getNormStatus(doc) {
        if (!doc) return 'To Do';
        const raw = (doc.status || 'In Review').trim().toLowerCase();
        if (raw.includes('approved') || raw.includes('accept')) return 'Approved';
        if (raw.includes('reject') || raw.includes('action')) return 'Need Action';
        return 'In Review';
      }

      function renderStatusBadge(status) {
        const s = status || 'To Do';
        let cls = 'to-do';
        let icon = '⚪';
        let label = s;
        if (s === 'Approved' || s === 'Accepted') {
          cls = 'approved';
          icon = '🟢';
          label = 'Approved';
        } else if (s === 'Optional' || s === 'Not Required') {
          cls = 'optional';
          icon = '🔹';
          label = 'Optional';
        } else if (s === 'In Review') {
          cls = 'in-review';
          icon = '🟡';
          label = 'In Review';
        } else if (s === 'Rejected' || s === 'Need Action') {
          cls = 'rejected';
          icon = '🔴';
          label = 'Need Action';
        } else {
          cls = 'to-do';
          icon = '⚪';
          label = 'To Do';
        }
        return `<span class="dash-status-pill ${cls}"><span class="dot"></span>${icon} ${label}</span>`;
      }

      function formatAcLine(text) {
        if (!text) return '';
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(
            /`([^`]+)`/g,
            '<code style="background: #f1f5f9; padding: 0.1rem 0.35rem; border-radius: 4px; font-family: monospace; font-size: 0.72rem; color: #475569;">$1</code>',
          );
      }

      function parseAcceptanceCriteriaFromSpec(markdownText) {
        if (!markdownText) return [];
        const lines = markdownText.split(/\r?\n/);
        const items = [];
        let inAcSection = false;

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const trimmed = line.trim();

          if (trimmed.match(/^##+\s+Acceptance\s+Criteria/i)) {
            inAcSection = true;
            continue;
          }

          if (inAcSection && trimmed.match(/^##+\s+[^\s]/)) {
            break;
          }

          if (inAcSection) {
            const checkMatch = trimmed.match(/^[-*]\s*\[([ xX])\]\s*(.*)$/);
            if (checkMatch) {
              items.push({
                isCompleted: checkMatch[1].toLowerCase() === 'x',
                text: checkMatch[2].trim(),
                raw: trimmed,
              });
            } else {
              const bulletMatch = trimmed.match(/^[-*]\s+(.*)$/);
              if (bulletMatch && bulletMatch[1].trim()) {
                items.push({
                  isCompleted: false,
                  text: bulletMatch[1].trim(),
                  raw: trimmed,
                });
              }
            }
          }
        }
        return items;
      }

        // Tier 2 (Brownfield) or Greenfield: Full dashboard

        const contextApproved = statusContext === 'Approved';
        const contextContrib = isBrownfieldTier2 && contextApproved ? 5 : 0;

        // Phase 1: Analysis (brief.md) - Weight: 5%
        const docBrief = getDoc('brief.md');

        const briefApproved = statusBrief === 'Approved';
        const briefContrib = briefApproved ? 5 : 0;

        // Phase 2A: PRD (prd.md) - Weight: 5% (or 10% if no standalone UX doc)
        const docPrd = getDoc('prd.md');
        const statusPrd = docPrd ? getNormStatus(docPrd) : 'To Do';

        // Phase 2B: UX Design (DESIGN.md / EXPERIENCE.md / ux.md) - Weight: 5%

        const badgeUx = hasUxDoc ? statusUx : isBrownfield ? 'Optional' : 'To Do';
        const metaUx = hasUxDoc

        const epicsContrib = epicsApproved ? (isBrownfieldTier2 ? 10 : 15) : 0;

        // Standalone Specs (Tier 1 specs present alongside Tier 2)
        const specDocs = getSpecDocs();
        const testDocs = getTestDocs();
        const hasStandaloneSpecs = isBrownfieldTier2 && specDocs.length > 0;
        const approvedSpecDocsCount = specDocs.filter((d) => getNormStatus(d) === 'Approved').length;
        const allSpecsApproved = specDocs.length > 0 && approvedSpecDocsCount === specDocs.length;
        const specContrib = hasStandaloneSpecs ? Math.round((approvedSpecDocsCount / specDocs.length) * 15) : 0;
        const phase4Weight = hasStandaloneSpecs ? 50 : 65;

        // Phase 4: Implementation (Weight: 50% if standalone specs exist, 65% otherwise)
        let phase4Contrib = 0;
        let parsedEpics = [];

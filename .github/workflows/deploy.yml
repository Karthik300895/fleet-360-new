name: Deploy Fleet-360 Frontend to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via Remote SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: 22
          script: |
            cd ~/fleet-360-new
            git checkout -- public/acl-markdown-files.json || true
            git pull origin main
            npm install
            npm run build
            pm2 restart fleet-360

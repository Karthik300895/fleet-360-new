name: Deploy Fleet-360 Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and Build
        run: |
          npm install
          npm run build

      - name: Sync to runtime directory and restart PM2 (API + static)
        run: |
          RUNTIME=/home/velocityone/fleet-360-new
          mkdir -p "$RUNTIME/dist" "$RUNTIME/api" "$RUNTIME/scripts"

          rsync -av --delete dist/ "$RUNTIME/dist/"
          rsync -av --delete api/ "$RUNTIME/api/"
          rsync -av scripts/serve-with-markdown-api.mjs scripts/acl-api-adapter.mjs "$RUNTIME/scripts/"
          rsync -av ecosystem.config.cjs package.json "$RUNTIME/"

          cd "$RUNTIME"
          if command -v pm2 >/dev/null 2>&1; then
            pm2 startOrReload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save
          else
            echo "pm2 not found — start manually: cd $RUNTIME && npm run start:local"
            exit 1
          fi

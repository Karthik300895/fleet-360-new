name: Deploy Fleet-360 Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and Build
        run: |
          npm install
          npm run build

      - name: Copy build to PM2 Directory and Restart
        run: |
          mkdir -p /home/velocityone/fleet-360-new/dist
          rsync -av --delete dist/ /home/velocityone/fleet-360-new/dist/
          # PM2 should run: ACL_LOCAL_SERVER=1 ACL_LOCAL_GIT_AUTO_PUSH=1 npm run start:local
          # from /home/velocityone/fleet-360-new (full git clone), not static-only hosting.
          pm2 restart fleet-360

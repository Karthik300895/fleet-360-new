name: Deploy Fleet-360 Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Restart Application
        run: |
          cd /home/velocityone/fleet-360-new
          git checkout -- public/acl-markdown-files.json || true
          git pull origin main
          npm install
          npm run build
          pm2 restart fleet-360
